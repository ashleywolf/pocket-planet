<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POCKET PLANET</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  overflow:hidden;height:100vh;cursor:grab}
body.dragging{cursor:grabbing}
canvas{display:block}

#ui{position:absolute;top:16px;left:16px;z-index:10;pointer-events:none}
#title-bar{font-size:28px;font-weight:700;letter-spacing:1px;
  text-shadow:0 0 20px rgba(100,180,255,.4);margin-bottom:4px}
#subtitle{font-size:13px;color:rgba(255,255,255,.4);margin-bottom:16px}
#planet-name{font-size:15px;color:rgba(100,200,255,.7);margin-bottom:16px;font-style:italic}

#controls{pointer-events:auto;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:14px 16px;
  width:220px;opacity:0.85;transition:opacity .2s}
#controls:hover{opacity:1}
#controls label{display:flex;justify-content:space-between;align-items:center;
  font-size:12px;color:rgba(255,255,255,.5);margin-bottom:8px}
#controls label span{color:rgba(255,255,255,.7)}
#controls input[type=range]{width:120px;height:4px;-webkit-appearance:none;
  background:rgba(255,255,255,.12);border-radius:2px;outline:none}
#controls input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;
  width:12px;height:12px;border-radius:50%;background:#4af;cursor:pointer}

.btn{display:inline-block;padding:8px 18px;font-size:13px;font-weight:600;
  color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
  border-radius:6px;cursor:pointer;transition:all .15s;margin-top:8px;margin-right:6px}
.btn:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.25)}

#info{position:absolute;bottom:16px;left:16px;font-size:11px;color:rgba(255,255,255,.25);z-index:10}
#fps{position:absolute;bottom:16px;right:16px;font-size:11px;color:rgba(255,255,255,.2);z-index:10}
</style>
</head>
<body>

<div id="ui">
  <div id="title-bar">POCKET PLANET</div>
  <div id="subtitle">procedural worlds from pure math</div>
  <div id="planet-name"></div>
  <div id="controls">
    <label>Sea Level <span id="v-sea">0.42</span>
      <input type="range" id="s-sea" min="0.2" max="0.7" step="0.01" value="0.42">
    </label>
    <label>Terrain Scale <span id="v-scale">1.0</span>
      <input type="range" id="s-scale" min="0.3" max="3.0" step="0.05" value="1.0">
    </label>
    <label>Roughness <span id="v-rough">0.5</span>
      <input type="range" id="s-rough" min="0.1" max="1.0" step="0.05" value="0.5">
    </label>
    <label>Cloud Density <span id="v-cloud">0.5</span>
      <input type="range" id="s-cloud" min="0.0" max="1.0" step="0.05" value="0.5">
    </label>
    <label>Atmosphere <span id="v-atmo">0.7</span>
      <input type="range" id="s-atmo" min="0.0" max="1.5" step="0.05" value="0.7">
    </label>
    <label>Rotation Speed <span id="v-rot">1.0</span>
      <input type="range" id="s-rot" min="0.0" max="3.0" step="0.1" value="1.0">
    </label>
    <button class="btn" onclick="newPlanet()">New Planet</button>
    <button class="btn" onclick="randomizeAll()">Randomize</button>
  </div>
</div>

<div id="info">drag to orbit / scroll to zoom / zero textures, zero assets, pure GLSL</div>
<div id="fps"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

/* ════════════════════════════════════════════════════════
   POCKET PLANET
   Procedural worlds from pure GLSL. No textures. No assets.
   ════════════════════════════════════════════════════════ */

// ── Noise GLSL (shared across shaders) ──
const NOISE_GLSL = `
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+10.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}

float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0);
  const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy));
  vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);
  vec3 l=1.0-g;
  vec3 i1=min(g.xyz,l.zxy);
  vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;
  vec3 x2=x0-i2+C.yyy;
  vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(
    i.z+vec4(0.0,i1.z,i2.z,1.0))
    +i.y+vec4(0.0,i1.y,i2.y,1.0))
    +i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857;
  vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z);
  vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy;
  vec4 y=y_*ns.x+ns.yyyy;
  vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy);
  vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0;
  vec4 s1=floor(b1)*2.0+1.0;
  vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;
  vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x);
  vec3 p1=vec3(a0.zw,h.y);
  vec3 p2=vec3(a1.xy,h.z);
  vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);
  m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}

float fbm(vec3 p, float octaves, float roughness){
  float val=0.0,amp=0.5,freq=1.0;
  for(float i=0.0;i<8.0;i++){
    if(i>=octaves)break;
    val+=amp*snoise(p*freq);
    freq*=2.0;
    amp*=roughness;
  }
  return val;
}
`;

// ── Planet Surface Shader ──
const planetVert = `
varying vec3 vNormal;
varying vec3 vPosition;
void main(){
  vNormal=normalize(normalMatrix*normal);
  vPosition=(modelMatrix*vec4(position,1.0)).xyz;
  gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
}`;

const planetFrag = `
${NOISE_GLSL}
uniform float uTime;
uniform float uSeed;
uniform float uSeaLevel;
uniform float uTerrainScale;
uniform float uRoughness;
uniform vec3 uSunDir;

varying vec3 vNormal;
varying vec3 vPosition;

void main(){
  vec3 p=normalize(vPosition)*uTerrainScale+vec3(uSeed);
  float n=fbm(p*1.8, 6.0, uRoughness)*0.5+0.5;

  vec3 color;
  float seaLevel=uSeaLevel;

  if(n<seaLevel){
    float depth=(seaLevel-n)/seaLevel;
    vec3 deepSea=vec3(0.01,0.03,0.15);
    vec3 shallow=vec3(0.02,0.15,0.35);
    color=mix(shallow,deepSea,depth);
    // Specular highlight on water
    vec3 viewDir=normalize(cameraPosition-vPosition);
    vec3 halfDir=normalize(uSunDir+viewDir);
    float spec=pow(max(dot(vNormal,halfDir),0.0),80.0);
    color+=vec3(spec*0.4);
  }else{
    float h=(n-seaLevel)/(1.0-seaLevel);
    vec3 beach=vec3(0.76,0.70,0.50);
    vec3 grass=vec3(0.15,0.45,0.12);
    vec3 forest=vec3(0.08,0.28,0.06);
    vec3 rock=vec3(0.35,0.30,0.25);
    vec3 snow=vec3(0.9,0.92,0.95);

    if(h<0.02) color=mix(beach,grass,h/0.02);
    else if(h<0.25) color=mix(grass,forest,(h-0.02)/0.23);
    else if(h<0.55) color=mix(forest,rock,(h-0.25)/0.3);
    else if(h<0.75) color=mix(rock,snow,(h-0.55)/0.2);
    else color=snow;

    // Detail noise on land
    float detail=snoise(p*8.0+vec3(uSeed*3.7))*0.08;
    color+=detail;
  }

  // Diffuse lighting
  float NdotL=max(dot(vNormal,uSunDir),0.0);
  float ambient=0.08;
  color*=(ambient+NdotL*0.92);

  // Night side city lights
  if(NdotL<0.05 && n>=seaLevel){
    float cityNoise=snoise(p*25.0+vec3(uSeed*7.3));
    float city=smoothstep(0.55,0.7,cityNoise)*smoothstep(0.05,0.0,NdotL);
    color+=vec3(1.0,0.85,0.4)*city*0.3;
  }

  gl_FragColor=vec4(color,1.0);
}`;

// ── Cloud Shader ──
const cloudVert = `
varying vec3 vNormal;
varying vec3 vPosition;
void main(){
  vNormal=normalize(normalMatrix*normal);
  vPosition=(modelMatrix*vec4(position,1.0)).xyz;
  gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
}`;

const cloudFrag = `
${NOISE_GLSL}
uniform float uTime;
uniform float uSeed;
uniform float uCloudDensity;
uniform vec3 uSunDir;
varying vec3 vNormal;
varying vec3 vPosition;

void main(){
  vec3 p=normalize(vPosition)*2.0+vec3(uSeed*1.3);
  p.x+=uTime*0.015;
  p.z+=uTime*0.008;

  float n=fbm(p*3.0, 5.0, 0.55)*0.5+0.5;
  float coverage=smoothstep(1.0-uCloudDensity*0.7,1.0,n);

  if(coverage<0.01) discard;

  float NdotL=max(dot(vNormal,uSunDir),0.0);
  float light=0.4+NdotL*0.6;
  vec3 color=vec3(light);
  color*=mix(0.15,1.0,smoothstep(0.0,0.15,NdotL));

  gl_FragColor=vec4(color,coverage*0.85);
}`;

// ── Atmosphere Shader ──
const atmoVert = `
varying vec3 vNormal;
varying vec3 vWorldPos;
void main(){
  vNormal=normalize(normalMatrix*normal);
  vWorldPos=(modelMatrix*vec4(position,1.0)).xyz;
  gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
}`;

const atmoFrag = `
uniform vec3 uSunDir;
uniform float uAtmoIntensity;
varying vec3 vNormal;
varying vec3 vWorldPos;
void main(){
  vec3 viewDir=normalize(cameraPosition-vWorldPos);
  float rim=1.0-max(dot(viewDir,vNormal),0.0);
  rim=pow(rim,3.0)*uAtmoIntensity;

  float NdotL=max(dot(vNormal,uSunDir),0.0);
  vec3 dayColor=vec3(0.3,0.5,1.0);
  vec3 sunsetColor=vec3(1.0,0.4,0.1);
  float sunsetFactor=smoothstep(0.0,0.3,NdotL)*smoothstep(0.5,0.15,NdotL);
  vec3 color=mix(dayColor,sunsetColor,sunsetFactor);

  float nightRim=rim*smoothstep(0.1,0.0,NdotL)*0.15;
  color+=vec3(0.1,0.15,0.4)*nightRim/max(rim,0.001);

  gl_FragColor=vec4(color,rim);
}`;

// ── Star Background ──
const starsVert = `
varying vec2 vUv;
void main(){
  vUv=uv;
  gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
}`;

const starsFrag = `
${NOISE_GLSL}
varying vec2 vUv;
void main(){
  vec3 dir=vec3(vUv*2.0-1.0,1.0);
  float n=snoise(dir*80.0);
  float star=smoothstep(0.92,0.95,n);
  float brightness=snoise(dir*120.0)*0.5+0.5;
  star*=0.3+brightness*0.7;

  float r=snoise(dir*90.0+vec3(100.0))*0.5+0.5;
  vec3 color=mix(vec3(0.8,0.85,1.0),vec3(1.0,0.9,0.7),r);

  float nebula=fbm(dir*3.0,4.0,0.6)*0.5+0.5;
  nebula=pow(nebula,4.0)*0.04;
  vec3 nebColor=mix(vec3(0.2,0.05,0.3),vec3(0.05,0.1,0.3),snoise(dir*5.0)*0.5+0.5);

  vec3 final=color*star+nebColor*nebula;
  gl_FragColor=vec4(final,1.0);
}`;

// ── Planet Name Generator ──
const prefixes=['Zeph','Kael','Myr','Thes','Vor','Lun','Aer','Nyx','Sol','Xar',
  'Cyr','Vel','Orth','Pyx','Draen','Hel','Fen','Gal','Nym','Ior'];
const middles=['an','or','is','ax','un','al','ir','os','el','ar','ix','on','us'];
const suffixes=['a','is','os','ia','um','on','ax','en','ur','yx','iel','ara','oth',
  'Prime','Minor','Major','VII','IX','Beta','Tau'];
function genName(){
  const p=prefixes[Math.floor(Math.random()*prefixes.length)];
  const m=middles[Math.floor(Math.random()*middles.length)];
  const s=suffixes[Math.floor(Math.random()*suffixes.length)];
  const name=p+m+(Math.random()>0.4?s:'');
  const desig=Math.random()>0.5?' '+String.fromCharCode(65+Math.floor(Math.random()*8))+'-'+Math.floor(Math.random()*900+100):'';
  return name+desig;
}

// ── Scene ──
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,1000);
camera.position.set(0,0,3.5);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

const sunDir=new THREE.Vector3(1,0.3,0.5).normalize();
let seed=Math.random()*1000;

// Planet
const planetMat=new THREE.ShaderMaterial({
  vertexShader:planetVert,fragmentShader:planetFrag,
  uniforms:{
    uTime:{value:0},uSeed:{value:seed},uSeaLevel:{value:0.42},
    uTerrainScale:{value:1.0},uRoughness:{value:0.5},uSunDir:{value:sunDir}
  }
});
const planet=new THREE.Mesh(new THREE.SphereGeometry(1,128,128),planetMat);
scene.add(planet);

// Clouds
const cloudMat=new THREE.ShaderMaterial({
  vertexShader:cloudVert,fragmentShader:cloudFrag,transparent:true,depthWrite:false,
  uniforms:{
    uTime:{value:0},uSeed:{value:seed},uCloudDensity:{value:0.5},uSunDir:{value:sunDir}
  }
});
const clouds=new THREE.Mesh(new THREE.SphereGeometry(1.015,96,96),cloudMat);
scene.add(clouds);

// Atmosphere
const atmoMat=new THREE.ShaderMaterial({
  vertexShader:atmoVert,fragmentShader:atmoFrag,transparent:true,depthWrite:false,
  side:THREE.BackSide,
  uniforms:{uSunDir:{value:sunDir},uAtmoIntensity:{value:0.7}}
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(1.12,64,64),atmoMat));

// Stars
const starMat=new THREE.ShaderMaterial({
  vertexShader:starsVert,fragmentShader:starsFrag,side:THREE.BackSide
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(100,32,32),starMat));

// ── Orbit Controls (manual) ──
let isDragging=false,prevMouse={x:0,y:0};
let rotX=0.3,rotY=0,targetRotX=0.3,targetRotY=0;
let zoom=3.5,targetZoom=3.5;
let autoRotSpeed=1.0;

renderer.domElement.addEventListener('pointerdown',e=>{
  isDragging=true;prevMouse={x:e.clientX,y:e.clientY};
  document.body.classList.add('dragging');
});
addEventListener('pointermove',e=>{
  if(!isDragging)return;
  targetRotY+=(e.clientX-prevMouse.x)*0.005;
  targetRotX+=(e.clientY-prevMouse.y)*0.005;
  targetRotX=Math.max(-Math.PI/2,Math.min(Math.PI/2,targetRotX));
  prevMouse={x:e.clientX,y:e.clientY};
});
addEventListener('pointerup',()=>{isDragging=false;document.body.classList.remove('dragging');});
renderer.domElement.addEventListener('wheel',e=>{
  targetZoom+=e.deltaY*0.002;
  targetZoom=Math.max(1.8,Math.min(8,targetZoom));
  e.preventDefault();
},{passive:false});

// ── Touch support ──
let lastTouchDist=0;
renderer.domElement.addEventListener('touchstart',e=>{
  if(e.touches.length===1){
    isDragging=true;prevMouse={x:e.touches[0].clientX,y:e.touches[0].clientY};
  }else if(e.touches.length===2){
    lastTouchDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY);
  }
},{passive:true});
renderer.domElement.addEventListener('touchmove',e=>{
  if(e.touches.length===1 && isDragging){
    const t=e.touches[0];
    targetRotY+=(t.clientX-prevMouse.x)*0.005;
    targetRotX+=(t.clientY-prevMouse.y)*0.005;
    targetRotX=Math.max(-Math.PI/2,Math.min(Math.PI/2,targetRotX));
    prevMouse={x:t.clientX,y:t.clientY};
  }else if(e.touches.length===2){
    const dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY);
    targetZoom+=(lastTouchDist-dist)*0.008;
    targetZoom=Math.max(1.8,Math.min(8,targetZoom));
    lastTouchDist=dist;
  }
  e.preventDefault();
},{passive:false});
renderer.domElement.addEventListener('touchend',()=>{isDragging=false;});

// ── Slider Bindings ──
const sliders={
  sea:{el:document.getElementById('s-sea'),vEl:document.getElementById('v-sea'),
    apply:v=>{planetMat.uniforms.uSeaLevel.value=v}},
  scale:{el:document.getElementById('s-scale'),vEl:document.getElementById('v-scale'),
    apply:v=>{planetMat.uniforms.uTerrainScale.value=v}},
  rough:{el:document.getElementById('s-rough'),vEl:document.getElementById('v-rough'),
    apply:v=>{planetMat.uniforms.uRoughness.value=v}},
  cloud:{el:document.getElementById('s-cloud'),vEl:document.getElementById('v-cloud'),
    apply:v=>{cloudMat.uniforms.uCloudDensity.value=v}},
  atmo:{el:document.getElementById('s-atmo'),vEl:document.getElementById('v-atmo'),
    apply:v=>{atmoMat.uniforms.uAtmoIntensity.value=v}},
  rot:{el:document.getElementById('s-rot'),vEl:document.getElementById('v-rot'),
    apply:v=>{autoRotSpeed=v}}
};
for(const [k,s] of Object.entries(sliders)){
  s.el.addEventListener('input',()=>{
    const v=parseFloat(s.el.value);
    s.vEl.textContent=v.toFixed(k==='sea'?2:1);
    s.apply(v);
  });
}

// ── New Planet / Randomize ──
window.newPlanet=function(){
  seed=Math.random()*1000;
  planetMat.uniforms.uSeed.value=seed;
  cloudMat.uniforms.uSeed.value=seed;
  document.getElementById('planet-name').textContent=genName();
};
window.randomizeAll=function(){
  window.newPlanet();
  const sets={
    sea:[0.25+Math.random()*0.4,2],
    scale:[0.4+Math.random()*2.2,1],
    rough:[0.15+Math.random()*0.75,1],
    cloud:[Math.random()*0.9,1],
    atmo:[0.2+Math.random()*1.1,1],
    rot:[0.3+Math.random()*2.2,1]
  };
  for(const [k,[v,dec]] of Object.entries(sets)){
    sliders[k].el.value=v;
    sliders[k].vEl.textContent=v.toFixed(dec);
    sliders[k].apply(v);
  }
};

document.getElementById('planet-name').textContent=genName();

// ── Resize ──
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

// ── Render Loop ──
let lastT=0,fpsFrames=0,fpsTime=0;
const fpsEl=document.getElementById('fps');

function animate(t){
  requestAnimationFrame(animate);
  const dt=(t-lastT)*0.001;
  lastT=t;

  fpsFrames++;fpsTime+=dt;
  if(fpsTime>=1){
    fpsEl.textContent=Math.round(fpsFrames/fpsTime)+' fps';
    fpsFrames=0;fpsTime=0;
  }

  // Smooth camera interpolation
  rotX+=(targetRotX-rotX)*0.08;
  rotY+=(targetRotY-rotY)*0.08;
  zoom+=(targetZoom-zoom)*0.08;
  if(!isDragging) targetRotY+=autoRotSpeed*0.003;

  camera.position.x=Math.sin(rotY)*Math.cos(rotX)*zoom;
  camera.position.y=Math.sin(rotX)*zoom;
  camera.position.z=Math.cos(rotY)*Math.cos(rotX)*zoom;
  camera.lookAt(0,0,0);

  const time=t*0.001;
  planetMat.uniforms.uTime.value=time;
  cloudMat.uniforms.uTime.value=time;
  clouds.rotation.y=time*0.008*autoRotSpeed;

  renderer.render(scene,camera);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
